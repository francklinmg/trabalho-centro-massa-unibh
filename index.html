<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Caminhão 3D - Centro de Massa (UniBH)</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #1e1e24;
      color: #fff;
      display: flex;
      flex-direction: column;
    }

    /* Área do Renderizador 3D Canvas */
    #canvas-container {
      flex: 1;
      width: 100%;
      height: 100%;
      position: relative;
      touch-action: none; /* Impede a rolagem padrão da página no celular */
    }

    /* Painel de Controles */
    #ui {
      background: rgba(18, 18, 22, 0.95);
      backdrop-filter: blur(8px);
      padding: 16px;
      z-index: 10;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.5);
      overflow-y: auto;
      max-height: 50vh; /* Ocupa no máximo metade da tela no celular */
    }

    /* Ajustes específicos para Desktop/Telas Grandes */
    @media (min-width: 768px) {
      #ui {
        position: absolute;
        top: 20px;
        left: 20px;
        width: 320px;
        max-height: calc(100vh - 40px);
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        border: 1px solid rgba(255,255,255,0.1);
      }
    }

    .control-group {
      margin-bottom: 12px;
    }

    label {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
      font-size: 0.9em;
      font-weight: 500;
      color: #ddd;
    }

    input[type="range"], select {
      width: 100%;
      height: 40px; /* Facilita o toque com o polegar no celular */
      padding: 6px 12px;
      background: #2b2b36;
      border: 1px solid #444;
      border-radius: 8px;
      color: #fff;
      font-size: 0.95em;
      outline: none;
    }

    input[type="range"] {
      height: 28px;
      accent-color: #3a86ff;
    }

    .info-box {
      background: rgba(255,255,255,0.05);
      padding: 10px;
      border-radius: 8px;
      font-size: 0.85em;
      color: #ccc;
      line-height: 1.5;
      margin-top: 8px;
    }

    #status {
      font-weight: bold;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid rgba(255,255,255,0.1);
      font-size: 1em;
      text-align: center;
    }
  </style>
  <!-- Three.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- OrbitControls -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <!-- Elemento 3D Canvas -->
  <div id="canvas-container"></div>

  <!-- Painel Interativo de Controles -->
  <div id="ui">
    <div class="control-group">
      <label for="tiltDirection">Eixo de Inclinação:</label>
      <select id="tiltDirection">
        <option value="side" selected>Lateral (Lado / Capotamento)</option>
        <option value="front">Frontal (Subida / Descida)</option>
      </select>
    </div>

    <div class="control-group">
      <label for="rampAngle">
        <span>Inclinação Rampa:</span>
        <span id="angleValue">0°</span>
      </label>
      <input type="range" id="rampAngle" min="0" max="60" value="0" step="0.5">
    </div>

    <div class="control-group">
      <label for="cargoState">Estado da Carga:</label>
      <select id="cargoState">
        <option value="empty">Vazio (CM Baixo)</option>
        <option value="half">Carga Média</option>
        <option value="full" selected>Carga Total (CM Alto)</option>
      </select>
    </div>

    <div class="info-box">
      Altura do CM (h<sub>CM</sub>): <strong id="cmHeightValue">0.0</strong>m<br>
      Base de Apoio Usada: <strong id="baseWidthValue">0.0</strong>m<br>
      Ângulo Limite Teórico: <strong id="criticalAngleValue">0°</strong>
    </div>

    <div id="status">Estado: Estável</div>
  </div>

<script>
  const container = document.getElementById('canvas-container');

  // 1. Cena e Câmera
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x1e1e24);

  const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
  camera.position.set(14, 9, 16);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(container.clientWidth, container.clientHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // Otimização para telas Retina/Celular
  renderer.shadowMap.enabled = true;
  container.appendChild(renderer.domElement);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;

  // 2. Iluminação
  scene.add(new THREE.AmbientLight(0xffffff, 0.6));
  const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
  dirLight.position.set(10, 20, 10);
  dirLight.castShadow = true;
  scene.add(dirLight);

  // 3. Rampa
  const rampGroup = new THREE.Group();
  scene.add(rampGroup);

  const rampGeo = new THREE.BoxGeometry(16, 0.4, 12);
  const rampMat = new THREE.MeshStandardMaterial({ color: 0x444444 });
  const ramp = new THREE.Mesh(rampGeo, rampMat);
  ramp.position.set(0, -0.2, 0);
  ramp.receiveShadow = true;
  rampGroup.add(ramp);

  // 4. Construção do Caminhão 3D
  const truckGroup = new THREE.Group();
  rampGroup.add(truckGroup);

  // Chassi
  const chassisGeo = new THREE.BoxGeometry(7, 0.4, 3);
  const chassisMat = new THREE.MeshStandardMaterial({ color: 0x222222 });
  const chassis = new THREE.Mesh(chassisGeo, chassisMat);
  chassis.position.set(0, 0.6, 0);
  truckGroup.add(chassis);

  // Rodas
  const wheelGeo = new THREE.CylinderGeometry(0.5, 0.5, 0.4, 16);
  const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
  wheelGeo.rotateX(Math.PI / 2);

  const wheelPositions = [
    [-2, 0.5, 1.5], [-2, 0.5, -1.5],
    [2, 0.5, 1.5], [2, 0.5, -1.5]
  ];
  wheelPositions.forEach(pos => {
    const wheel = new THREE.Mesh(wheelGeo, wheelMat);
    wheel.position.set(...pos);
    truckGroup.add(wheel);
  });

  // Cabine
  const cabinGeo = new THREE.BoxGeometry(2, 2, 2.8);
  const cabinMat = new THREE.MeshStandardMaterial({ color: 0xd90429 });
  const cabin = new THREE.Mesh(cabinGeo, cabinMat);
  cabin.position.set(2.2, 1.8, 0);
  truckGroup.add(cabin);

  // Baú de Carga
  const trunkGeo = new THREE.BoxGeometry(4.5, 3, 2.8);
  const trunkMat = new THREE.MeshStandardMaterial({ color: 0xedf2f4, transparent: true, opacity: 0.6 });
  const trunk = new THREE.Mesh(trunkGeo, trunkMat);
  trunk.position.set(-1.2, 2.3, 0);
  truckGroup.add(trunk);

  // Carga interna visível
  const cargoGeo = new THREE.BoxGeometry(4.3, 1, 2.6);
  const cargoMat = new THREE.MeshStandardMaterial({ color: 0xf77f00 });
  const cargoMesh = new THREE.Mesh(cargoGeo, cargoMat);
  cargoMesh.position.set(-1.2, 1.3, 0);
  truckGroup.add(cargoMesh);

  // Esfera do Centro de Massa (CM)
  const cmGeo = new THREE.SphereGeometry(0.25, 16, 16);
  const cmMat = new THREE.MeshBasicMaterial({ color: 0xffff00 });
  const cmMesh = new THREE.Mesh(cmGeo, cmMat);
  truckGroup.add(cmMesh);

  // Vetor Gravidade (Linha que desce do CM)
  const gravityLineGeo = new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(0, 0, 0),
    new THREE.Vector3(0, -10, 0)
  ]);
  const gravityLineMat = new THREE.LineDashedMaterial({ 
    color: 0x06d6a0, 
    dashSize: 0.2, 
    gapSize: 0.1 
  });
  const gravityLine = new THREE.Line(gravityLineGeo, gravityLineMat);
  gravityLine.computeLineDistances();
  scene.add(gravityLine);

  // 5. Controles e Lógica Física
  const rampAngleInput = document.getElementById('rampAngle');
  const cargoStateSelect = document.getElementById('cargoState');
  const tiltDirectionSelect = document.getElementById('tiltDirection');

  const angleLabel = document.getElementById('angleValue');
  const cmHeightLabel = document.getElementById('cmHeightValue');
  const baseWidthLabel = document.getElementById('baseWidthValue');
  const criticalAngleLabel = document.getElementById('criticalAngleValue');
  const statusLabel = document.getElementById('status');

  const halfWidthSide = 1.5;  // Metade da distância entre as rodas nas laterais
  const halfWidthFront = 2.0; // Metade da distância entre os eixos dianteiro e traseiro

  function update() {
    const angleDeg = parseFloat(rampAngleInput.value);
    const cargoState = cargoStateSelect.value;
    const tiltDir = tiltDirectionSelect.value;

    let cmHeight = 1.1; // Vazio
    if (cargoState === 'half') {
      cmHeight = 1.8;
      cargoMesh.visible = true;
      cargoMesh.scale.set(1, 1, 1);
      cargoMesh.position.y = 1.3;
    } else if (cargoState === 'full') {
      cmHeight = 2.5; // Cheio
      cargoMesh.visible = true;
      cargoMesh.scale.set(1, 2.5, 1);
      cargoMesh.position.y = 2.05;
    } else {
      cargoMesh.visible = false;
    }

    // Posição do CM no caminhão
    cmMesh.position.set(-0.2, cmHeight, 0);

    // Seleção do apoio conforme direção
    const halfBase = (tiltDir === 'side') ? halfWidthSide : halfWidthFront;
    baseWidthLabel.textContent = (halfBase * 2).toFixed(1);

    // Cálculo do Ângulo Crítico
    const criticalAngleRad = Math.atan(halfBase / cmHeight);
    const criticalAngleDeg = (criticalAngleRad * 180) / Math.PI;

    angleLabel.textContent = `${angleDeg.toFixed(1)}°`;
    cmHeightLabel.textContent = cmHeight.toFixed(2);
    criticalAngleLabel.textContent = `${criticalAngleDeg.toFixed(1)}°`;

    // Reseta Rotações
    rampGroup.rotation.set(0, 0, 0);
    truckGroup.rotation.set(0, 0, 0);

    const angleRad = THREE.MathUtils.degToRad(angleDeg);

    if (tiltDir === 'side') {
      rampGroup.rotation.x = angleRad;
    } else {
      rampGroup.rotation.z = angleRad;
    }

    // Atualiza o vetor da gravidade
    const cmWorldPos = new THREE.Vector3();
    cmMesh.getWorldPosition(cmWorldPos);
    gravityLine.position.copy(cmWorldPos);

    // Validação de Tombo
    if (angleDeg < criticalAngleDeg) {
      gravityLineMat.color.setHex(0x06d6a0); // Verde
      statusLabel.textContent = "Estado: Estável";
      statusLabel.style.color = "#06d6a0";
    } else {
      gravityLineMat.color.setHex(0xef476f); // Vermelho
      statusLabel.textContent = `Estado: TOMBOU! (Limite: ${criticalAngleDeg.toFixed(1)}°)`;
      statusLabel.style.color = "#ef476f";

      const extraAngle = THREE.MathUtils.degToRad(angleDeg - criticalAngleDeg);
      if (tiltDir === 'side') {
        truckGroup.rotation.x = extraAngle * 2;
      } else {
        truckGroup.rotation.z = -extraAngle * 2;
      }
    }
  }

  rampAngleInput.addEventListener('input', update);
  cargoStateSelect.addEventListener('change', update);
  tiltDirectionSelect.addEventListener('change', update);

  function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
  }

  // Redimensionamento responsivo dinâmico
  window.addEventListener('resize', () => {
    camera.aspect = container.clientWidth / container.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(container.clientWidth, container.clientHeight);
  });

  update();
  animate();
</script>
</body>
</html>
