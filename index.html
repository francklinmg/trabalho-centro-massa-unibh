<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Caminhão 3D - Centro de Massa (UniBH)</title>
<style>
  * { box-sizing: border-box; }
  body, html { margin:0; padding:0; width:100%; height:100%; overflow:hidden; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; background:#1e1e24; color:#fff; display:flex; flex-direction:column; }
  #canvas-container { flex:1; width:100%; height:100%; position:relative; touch-action:none; }
  #ui { background:rgba(18,18,22,.95); backdrop-filter:blur(8px); padding:16px; z-index:10; box-shadow:0 -4px 20px rgba(0,0,0,.5); overflow-y:auto; max-height:55vh; }
  @media (min-width:768px) {
    #ui { position:absolute; top:20px; left:20px; width:330px; max-height:calc(100vh - 40px); border-radius:12px; border:1px solid rgba(255,255,255,.1); }
  }
  .control-group { margin-bottom:12px; }
  label, .lbl { display:flex; justify-content:space-between; margin-bottom:6px; font-size:.9em; font-weight:500; color:#ddd; }
  input[type=range], select { width:100%; height:40px; padding:6px 12px; background:#2b2b36; border:1px solid #444; border-radius:8px; color:#fff; font-size:.95em; outline:none; }
  input[type=range] { height:28px; accent-color:#3a86ff; }
  .info-box { background:rgba(255,255,255,.05); padding:10px; border-radius:8px; font-size:.85em; color:#ccc; line-height:1.6; margin-top:8px; }
  #status { font-weight:bold; margin-top:10px; padding-top:10px; border-top:1px solid rgba(255,255,255,.1); text-align:center; }
  #grid { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; max-width:210px; margin:0 auto; }
  .cell { height:46px; border-radius:8px; border:1px solid #555; background:#2b2b36; color:#aaa; font-size:.75em; cursor:pointer; }
  .cell.on { background:#f77f00; border-color:#ffb347; color:#fff; font-weight:bold; }
  .cols { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; max-width:210px; margin:0 auto 4px; font-size:.72em; color:#999; text-align:center; }
  .row { display:flex; gap:8px; }
  .row button { flex:1; height:36px; background:#2b2b36; color:#fff; border:1px solid #444; border-radius:8px; cursor:pointer; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
<div id="canvas-container"></div>

<div id="ui">
  <div class="control-group">
    <div class="lbl">Compartimentos (vista traseira do baú)</div>
    <div class="cols"><span>Esquerda</span><span>Centro</span><span>Direita</span></div>
    <div id="grid"></div>
  </div>

  <div class="control-group">
    <label for="preset">Predefinição de carga:</label>
    <select id="preset">
      <option value="custom">Personalizada (clique na grade)</option>
      <option value="8" selected>Direita embaixo</option>
      <option value="0">Esquerda em cima</option>
      <option value="1">Centro em cima</option>
      <option value="7">Centro embaixo</option>
      <option value="4">Centro (meio)</option>
      <option value="2,5,8">Coluna direita</option>
      <option value="0,3,6">Coluna esquerda</option>
      <option value="0,1,2">Linha de cima</option>
      <option value="6,7,8">Linha de baixo</option>
      <option value="0,1,2,3,4,5,6,7,8">Tudo cheio</option>
      <option value="none">Vazio</option>
    </select>
  </div>

  <div class="control-group">
    <label for="cellMass">Peso por compartimento:</label>
    <select id="cellMass">
      <option value="1">Leve</option>
      <option value="2" selected>Médio</option>
      <option value="4">Pesado</option>
    </select>
  </div>

  <div class="control-group">
    <label for="tiltDirection">Eixo de inclinação:</label>
    <select id="tiltDirection">
      <option value="side" selected>Lateral (capotamento)</option>
      <option value="front">Frontal (subida)</option>
    </select>
  </div>

  <div class="control-group" id="sideGroup">
    <label for="sideDir">Lado que desce:</label>
    <select id="sideDir">
      <option value="1" selected>Direito</option>
      <option value="-1">Esquerdo</option>
    </select>
  </div>

  <div class="control-group">
    <label for="rampAngle"><span>Inclinação da rampa:</span><span id="angleValue">0°</span></label>
    <input type="range" id="rampAngle" min="0" max="60" value="0" step="0.5">
  </div>

  <div class="row">
    <button id="viewRear">Ver por trás</button>
    <button id="viewSide">Ver lateral</button>
  </div>

  <div class="info-box">
    Altura do CM: <strong id="cmH">0</strong> m<br>
    Posição lateral do CM: <strong id="cmZ">0</strong><br>
    Distância CM → ponto de tombo: <strong id="distV">0</strong> m<br>
    Ângulo limite teórico: <strong id="critV">0°</strong>
  </div>
  <div id="status">Estado: Estável</div>
</div>

<script>
const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1e1e24);
const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
camera.position.set(14, 9, 16);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(container.clientWidth, container.clientHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
container.appendChild(renderer.domElement);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 1.5, 0);

scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const dl = new THREE.DirectionalLight(0xffffff, 0.8);
dl.position.set(10, 20, 10);
scene.add(dl);

// Rampa
const rampGroup = new THREE.Group();
scene.add(rampGroup);
const ramp = new THREE.Mesh(new THREE.BoxGeometry(16, 0.4, 12), new THREE.MeshStandardMaterial({ color: 0x444444 }));
ramp.position.set(0, -0.2, 0);
rampGroup.add(ramp);

// Caminhão
const truckGroup = new THREE.Group();
rampGroup.add(truckGroup);
function add(mesh, x, y, z) { mesh.position.set(x, y, z); truckGroup.add(mesh); return mesh; }

add(new THREE.Mesh(new THREE.BoxGeometry(7, 0.4, 3), new THREE.MeshStandardMaterial({ color: 0x222222 })), 0, 0.6, 0);
const wheelGeo = new THREE.CylinderGeometry(0.5, 0.5, 0.4, 16);
wheelGeo.rotateX(Math.PI / 2);
const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
[[-2,.5,1.5],[-2,.5,-1.5],[2,.5,1.5],[2,.5,-1.5]].forEach(p => add(new THREE.Mesh(wheelGeo, wheelMat), ...p));
add(new THREE.Mesh(new THREE.BoxGeometry(2, 2, 2.8), new THREE.MeshStandardMaterial({ color: 0xd90429 })), 2.2, 1.8, 0);
add(new THREE.Mesh(new THREE.BoxGeometry(4.5, 3, 2.8),
  new THREE.MeshStandardMaterial({ color: 0xedf2f4, transparent: true, opacity: 0.12, depthWrite: false })), -1.2, 2.3, 0);

// 9 compartimentos: índice = linha*3 + coluna (linha 0 = topo, coluna 0 = esquerda; direita = +z)
const CELL_Y = [3.3, 2.3, 1.3];
const CELL_Z = [-0.933, 0, 0.933];
const CELL_X = -1.2;
const cellFill = [];
const edgeGeo = new THREE.EdgesGeometry(new THREE.BoxGeometry(4.5, 1, 0.933));
for (let i = 0; i < 9; i++) {
  const r = Math.floor(i / 3), c = i % 3;
  const edges = new THREE.LineSegments(edgeGeo, new THREE.LineBasicMaterial({ color: 0x9aa0c0 }));
  add(edges, CELL_X, CELL_Y[r], CELL_Z[c]);
  const fill = new THREE.Mesh(new THREE.BoxGeometry(4.2, 0.85, 0.8), new THREE.MeshStandardMaterial({ color: 0xf77f00 }));
  add(fill, CELL_X, CELL_Y[r], CELL_Z[c]);
  cellFill.push(fill);
}

// Centro de massa e gravidade
const cmMesh = new THREE.Mesh(new THREE.SphereGeometry(0.25, 16, 16), new THREE.MeshBasicMaterial({ color: 0xffff00, depthTest: false }));
cmMesh.renderOrder = 10;
truckGroup.add(cmMesh);
const gravityLineMat = new THREE.LineDashedMaterial({ color: 0x06d6a0, dashSize: 0.2, gapSize: 0.1 });
const gravityLine = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0), new THREE.Vector3(0,-10,0)]), gravityLineMat);
gravityLine.computeLineDistances();
scene.add(gravityLine);

// UI
const $ = id => document.getElementById(id);
const loaded = Array(9).fill(false);
const gridEl = $('grid');
const nomesLinha = ['Topo', 'Meio', 'Base'];
const buttons = [];
for (let i = 0; i < 9; i++) {
  const b = document.createElement('button');
  b.className = 'cell';
  b.textContent = nomesLinha[Math.floor(i / 3)];
  b.addEventListener('click', () => { loaded[i] = !loaded[i]; $('preset').value = 'custom'; update(); });
  gridEl.appendChild(b);
  buttons.push(b);
}

function applyPreset(v) {
  if (v === 'custom') return;
  loaded.fill(false);
  if (v !== 'none') v.split(',').forEach(n => loaded[+n] = true);
}

const TRUCK_MASS = 6, TRUCK_CM = { x: -0.2, y: 1.1, z: 0 };
const HALF_SIDE = 1.5, REAR_AXLE_X = -2;

function update() {
  const angleDeg = parseFloat($('rampAngle').value);
  const tiltDir = $('tiltDirection').value;
  const s = parseFloat($('sideDir').value);
  const m = parseFloat($('cellMass').value);
  $('sideGroup').style.display = tiltDir === 'side' ? '' : 'none';

  // Centro de massa ponderado
  let M = TRUCK_MASS, sx = TRUCK_MASS * TRUCK_CM.x, sy = TRUCK_MASS * TRUCK_CM.y, sz = 0;
  for (let i = 0; i < 9; i++) {
    cellFill[i].visible = loaded[i];
    buttons[i].classList.toggle('on', loaded[i]);
    if (loaded[i]) {
      M += m; sx += m * CELL_X; sy += m * CELL_Y[Math.floor(i / 3)]; sz += m * CELL_Z[i % 3];
    }
  }
  const xc = sx / M, yc = sy / M, zc = sz / M;
  cmMesh.position.set(xc, yc, zc);

  // Distância horizontal até a aresta de tombamento
  let dist;
  if (tiltDir === 'side') dist = HALF_SIDE - s * zc;
  else dist = xc - REAR_AXLE_X;
  const critDeg = Math.atan(dist / yc) * 180 / Math.PI;

  $('angleValue').textContent = angleDeg.toFixed(1) + '°';
  $('cmH').textContent = yc.toFixed(2);
  const lado = Math.abs(zc) < 0.02 ? 'centrado' : (zc > 0 ? 'direita ' : 'esquerda ') + Math.abs(zc).toFixed(2) + ' m';
  $('cmZ').textContent = lado;
  $('distV').textContent = dist.toFixed(2);
  $('critV').textContent = critDeg.toFixed(1) + '°';

  rampGroup.rotation.set(0, 0, 0);
  truckGroup.rotation.set(0, 0, 0);
  const a = THREE.MathUtils.degToRad(angleDeg);
  if (tiltDir === 'side') rampGroup.rotation.x = s * a; else rampGroup.rotation.z = a;

  const st = $('status');
  if (angleDeg < critDeg) {
    gravityLineMat.color.setHex(0x06d6a0);
    st.textContent = 'Estado: Estável';
    st.style.color = '#06d6a0';
  } else {
    gravityLineMat.color.setHex(0xef476f);
    st.textContent = `Estado: TOMBOU! (Limite: ${critDeg.toFixed(1)}°)`;
    st.style.color = '#ef476f';
    const extra = THREE.MathUtils.degToRad(angleDeg - critDeg);
    if (tiltDir === 'side') truckGroup.rotation.x = s * extra * 2; else truckGroup.rotation.z = -extra * 2;
  }

  // Gravidade a partir do CM (após aplicar as rotações)
  scene.updateMatrixWorld(true);
  const w = new THREE.Vector3();
  cmMesh.getWorldPosition(w);
  gravityLine.position.copy(w);
}

$('preset').addEventListener('change', e => { applyPreset(e.target.value); update(); });
['rampAngle', 'cellMass', 'tiltDirection', 'sideDir'].forEach(id => $(id).addEventListener('input', update));
$('viewRear').addEventListener('click', () => { camera.position.set(-20, 6, 0); controls.target.set(0, 1.5, 0); });
$('viewSide').addEventListener('click', () => { camera.position.set(14, 9, 16); controls.target.set(0, 1.5, 0); });

window.addEventListener('resize', () => {
  camera.aspect = container.clientWidth / container.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(container.clientWidth, container.clientHeight);
});

function animate() { requestAnimationFrame(animate); controls.update(); renderer.render(scene, camera); }
applyPreset($('preset').value);
update();
animate();
</script>
</body>
</html>
